name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/LinkNest.Tests/LinkNest.Tests.csproj

      - name: Test
        run: dotnet test tests/LinkNest.Tests/LinkNest.Tests.csproj -c Release --no-restore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t linknest-api:ci .

      - name: Build Web image
        run: docker build -f Dockerfile.web -t linknest-web:ci .
