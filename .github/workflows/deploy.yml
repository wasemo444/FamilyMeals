name: Deploy

# Builds and publishes container images to GitHub Container Registry (ghcr.io).
# On first use: enable Packages write permission (default with GITHUB_TOKEN on push to main).
#
# Pull on your server:
#   docker pull ghcr.io/<owner>/linknest-api:latest
#   docker pull ghcr.io/<owner>/linknest-web:latest
#
# Or use docker-compose.prod.yml with image: instead of build: after pushing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          echo "IMAGE_API=${{ env.REGISTRY }}/${{ github.repository_owner }}/linknest-api" >> $GITHUB_ENV
          echo "IMAGE_WEB=${{ env.REGISTRY }}/${{ github.repository_owner }}/linknest-web" >> $GITHUB_ENV

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
