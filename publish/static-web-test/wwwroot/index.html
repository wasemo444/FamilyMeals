<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LinkNest" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <base href="/" />
    <script>
        (function () {
            try {
                var k = "linknest-theme";
                var t = localStorage.getItem(k);
                if (t !== "light" && t !== "dark") {
                    t = "dark";
                    localStorage.setItem(k, t);
                }
                document.documentElement.setAttribute("data-theme", t);
                document.documentElement.style.colorScheme = t;
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
                document.documentElement.style.colorScheme = "dark";
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="_content/LinkNest.Shared/js/theme.js"></script>
    <link rel="stylesheet" href="_content/LinkNest.Shared/css/linknest.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="LinkNest.Web.Client.styles.css" />
    <style>
        .loading-progress { position: relative; display: block; width: 4rem; height: 4rem; margin: 20vh auto 1rem; }
        .loading-progress circle { fill: none; stroke: #2f7d4b; stroke-width: 0.25rem; transform-origin: 50% 50%; transform: rotate(-90deg); }
        .loading-progress circle:last-child { stroke-dasharray: calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%; transition: stroke-dasharray 0.05s ease-in-out; }
        .loading-progress-text { text-align: center; font-family: "Albert Sans", sans-serif; color: #5f6f66; }
        html[data-theme="dark"] .loading-progress-text { color: #a8b5ad; }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" aria-hidden="true">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Loading LinkNest…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
